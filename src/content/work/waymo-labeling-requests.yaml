title: Waymo Label Requesting Redesign
org: Waymo
year: "2024"
order: 2

cardTitle: A request form that explains itself
summary: >-
  Turning a sprawling, tribal-knowledge request process into a guided form that explains itself. Made trade-offs to fit the needs of the majority of users. Every field says what it's for and what happens downstream, so the most common requests wouldn't need a labeling engineer on call.
thumb: assets/home/waymo-thumb.png
thumbAlt: Labeling request prototype

dek: >-
  Redesigning how ML engineers request human-labeled data at Waymo — collapsing a sprawling, tribal-knowledge process into a guided multi-step form that doesn't need a labeling engineer on call.
team: Waymo ML Infrastructure & UX
role: UX Design & Prototyping
timeline: Oct – Dec 2024
tools: Figma, HTML, CSS, JavaScript
